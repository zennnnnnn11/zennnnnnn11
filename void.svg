<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200">
  <style>
    .ship {
      animation: float 4.5s ease-in-out infinite;
      transform-origin: center;
    }
    .thrust {
      animation: thrust 1.2s ease-in-out infinite alternate;
    }
    .star1 {
      animation: twinkle 3s ease-in-out infinite;
    }
    .star2 {
      animation: twinkle 4s ease-in-out infinite 1.5s;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #2B2A27;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 1.8px;
      fill: #787670;
    }
    .ship-body {
      fill: #2B2A27;
    }
    .ship-accent {
      fill: #787670;
    }
    .ship-thrust {
      fill: #A09E96;
    }
    .star {
      fill: #787670;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes thrust {
      0% { opacity: 0.25; transform: scaleY(0.85); }
      100% { opacity: 0.85; transform: scaleY(1.2); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    @media (prefers-color-scheme: dark) {
      .title { fill: #F5F4EE; }
      .subtitle { fill: #C2C1B9; }
      .ship-body { fill: #F5F4EE; }
      .ship-accent { fill: #C2C1B9; }
      .ship-thrust { fill: #E5E4DE; }
      .star { fill: #E5E4DE; }
    }
  </style>

  <g transform="translate(300, 50)" text-anchor="middle">
    <!-- Ambient Pixel Stars -->
    <rect class="star star1" x="-150" y="-15" width="2" height="2" />
    <rect class="star star2" x="145" y="-5" width="2" height="2" />
    <rect class="star star1" x="110" y="25" width="1.5" height="1.5" />
    <rect class="star star2" x="-120" y="20" width="1.5" height="1.5" />

    <!-- Minimal Pixel Spaceship (Centered) -->
    <g class="ship">
      <!-- Cockpit / Nose -->
      <rect class="ship-body" x="-1" y="-18" width="2" height="4" />
      <rect class="ship-body" x="-2" y="-14" width="4" height="4" />
      <rect class="ship-body" x="-3" y="-10" width="6" height="4" />

      <!-- Center Cockpit Window -->
      <rect class="ship-accent" x="-1.5" y="-8" width="3" height="2" />

      <!-- Fuselage -->
      <rect class="ship-body" x="-4" y="-6" width="8" height="6" />

      <!-- Wings -->
      <rect class="ship-body" x="-8" y="-2" width="16" height="4" />
      <rect class="ship-body" x="-11" y="2" width="22" height="3" />
      <rect class="ship-body" x="-13" y="5" width="4" height="2" />
      <rect class="ship-body" x="9" y="5" width="4" height="2" />

      <!-- Wing Accents -->
      <rect class="ship-accent" x="-9" y="2" width="2" height="2" />
      <rect class="ship-accent" x="7" y="2" width="2" height="2" />

      <!-- Engines -->
      <rect class="ship-body" x="-4" y="5" width="3" height="2" />
      <rect class="ship-body" x="1" y="5" width="3" height="2" />

      <!-- Thrust Particles (Animated) -->
      <g class="thrust" transform="translate(0, 7)">
        <rect class="ship-thrust" x="-3.5" y="0" width="2" height="3" />
        <rect class="ship-thrust" x="1.5" y="0" width="2" height="3" />
        <rect class="ship-thrust" x="-3" y="3" width="1" height="2" opacity="0.6" />
        <rect class="ship-thrust" x="2" y="3" width="1" height="2" opacity="0.6" />
      </g>
    </g>

    <!-- Text Typography -->
    <text y="68" class="title">// 404: Identity Not Found.</text>
    <text y="98" class="subtitle">// All signals lost in transmission.</text>
  </g>
</svg>