<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="160">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #2B2A27;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.8px;
      fill: #73726C;
    }
    .wave {
      stroke: #73726C;
      stroke-width: 1.2;
      stroke-opacity: 0.35;
      fill: none;
    }
    @media (prefers-color-scheme: dark) {
      .title {
        fill: #F5F4EE;
      }
      .subtitle {
        fill: #C2C1B9;
      }
      .wave {
        stroke: #F5F4EE;
        stroke-opacity: 0.35;
      }
    }
  </style>
  <g transform="translate(300, 35)" text-anchor="middle">
    <!-- Subtle Sine Wave -->
    <path class="wave" d="M -120 0 Q -90 -8, -60 0 T 0 0 T 60 0 T 120 0" />
    <circle cx="0" cy="0" r="1.5" fill="#F5F4EE" opacity="0.6" />
    
    <!-- Lines -->
    <text y="48" class="title">// 404: Identity Not Found.</text>
    <text y="80" class="subtitle">// All signals lost in transmission.</text>
  </g>
</svg>